appId: ${APP_ID}
name: mode_switch_button_disabled_while_timer_running
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    id: "timer-toggle-button"
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    text: "Break"
    enabled: false
- assertNotVisible:
    id: "timer-toggle-button"
- assertNotVisible:
    id: "timer-cancel-button"
