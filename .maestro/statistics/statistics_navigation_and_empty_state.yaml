appId: ${APP_ID}
name: statistics_navigation_and_empty_state
tags:
  - statistics
---
- runFlow:
    file: ../common/launch_app_allow_notifications.yaml
- runFlow:
    file: ../common/open_statistics.yaml
- assertVisible: "No focus sessions yet"
- assertVisible: "Complete a focus timer to see your statistics here."
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "timer-toggle-button"
    timeout: 10000
- runFlow:
    file: ../common/open_statistics.yaml
- swipe:
    from:
      text: "Statistics"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "timer-toggle-button"
    timeout: 10000
