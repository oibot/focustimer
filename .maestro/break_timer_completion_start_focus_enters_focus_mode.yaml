appId: ${APP_ID}
name: break_timer_completion_start_focus_enters_focus_mode
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- runFlow:
    file: common/setup_short_break_timer.yaml
- tapOn:
    id: "timer-toggle-button"
- extendedWaitUntil:
    visible:
      id: "timer-done-start-button"
      text: "Start Focus"
    timeout: 7000
- tapOn:
    id: "timer-done-start-button"
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertVisible:
    text: "Break"
    enabled: true
