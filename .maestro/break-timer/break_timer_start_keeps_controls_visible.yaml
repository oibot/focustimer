appId: ${APP_ID}
name: break_timer_start_keeps_controls_visible
tags:
  - break-timer
---
- runFlow:
    file: ../common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- tapOn:
    id: "timer-toggle-button"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- assertVisible:
    id: "timer-toggle-button"
    text: "Pause"
    enabled: true
- assertVisible:
    id: "timer-cancel-button"
    text: "Stop"
    enabled: true
- assertVisible:
    text: "Focus"
    enabled: false
