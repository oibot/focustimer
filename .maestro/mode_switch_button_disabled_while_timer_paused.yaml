appId: ${APP_ID}
name: mode_switch_button_disabled_while_timer_paused
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    id: "timer-toggle-button"
- tapOn:
    id: "timer-tap-gesture-background"
- tapOn:
    id: "timer-toggle-button"
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    id: "timer-toggle-button"
    text: "Resume"
    enabled: true
- assertVisible:
    id: "timer-cancel-button"
    text: "Cancel"
    enabled: true
- assertVisible:
    text: "Break"
    enabled: false
