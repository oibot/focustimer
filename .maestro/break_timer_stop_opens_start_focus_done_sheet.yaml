appId: ${APP_ID}
name: break_timer_stop_opens_start_focus_done_sheet
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- tapOn:
    id: "timer-toggle-button"
- tapOn:
    id: "timer-cancel-button"
- assertVisible:
    id: "timer-done-start-button"
    text: "Start Focus"
- assertVisible:
    id: "timer-done-cancel-button"
    text: "Cancel"
