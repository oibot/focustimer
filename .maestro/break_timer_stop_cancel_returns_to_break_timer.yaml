appId: ${APP_ID}
name: break_timer_stop_cancel_returns_to_break_timer
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- tapOn:
    id: "timer-toggle-button"
- tapOn:
    id: "timer-cancel-button"
- assertVisible: "Start Focus"
- tapOn: "Cancel"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Focus"
    enabled: true
