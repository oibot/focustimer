appId: ${APP_ID}
name: notification_permission_denied_still_opens_timer
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- tapOn:
    text: "^Don.t [Aa]llow$"
    optional: true
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    id: "timer-readout"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Break"
    enabled: true
