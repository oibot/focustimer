appId: ${APP_ID}
name: mode_switch_button_changes_focus_to_break_when_idle
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- tapOn:
    text: "Break"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Focus"
    enabled: true
