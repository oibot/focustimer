appId: ${APP_ID}
name: break_timer_initial_state
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- assertVisible:
    id: "timer-readout"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Focus"
    enabled: true
