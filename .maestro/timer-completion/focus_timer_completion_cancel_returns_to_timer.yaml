appId: ${APP_ID}
name: focus_timer_completion_cancel_returns_to_timer
tags:
  - timer-completion
---
- runFlow:
    file: ../common/launch_app_allow_notifications.yaml
- runFlow:
    file: ../common/setup_short_focus_timer.yaml
- tapOn:
    id: "timer-toggle-button"
- extendedWaitUntil:
    visible:
      id: "timer-done-start-button"
      text: "Start Break"
    timeout: 7000
- tapOn:
    id: "timer-done-cancel-button"
- extendedWaitUntil:
    notVisible:
      id: "timer-done-start-button"
      text: "Start Break"
    timeout: 7000
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertVisible:
    text: "Break"
    enabled: true
