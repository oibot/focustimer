appId: ${APP_ID}
name: mode_switch_button_changes_break_to_focus_when_idle
tags:
  - mode-switching
---
- runFlow:
    file: ../common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- tapOn:
    text: "Focus"
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    id: "timer-toggle-button"
    text: "Start"
    enabled: true
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Break"
    enabled: true
