appId: ${APP_ID}
name: edge_swipe_changes_break_to_focus_when_idle
tags:
  - mode-switching
---
- runFlow:
    file: ../common/launch_app_allow_notifications.yaml
- tapOn:
    text: "Break"
- assertVisible:
    id: "timer-mode-title"
    text: "Break"
- assertVisible:
    id: "timer-edge-swipe-left"
- swipe:
    from:
      id: "timer-edge-swipe-left"
    direction: RIGHT
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    text: "Break"
    enabled: true
