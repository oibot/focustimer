appId: ${APP_ID}
name: edge_swipe_disabled_while_timer_active
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    id: "timer-toggle-button"
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertNotVisible:
    id: "timer-edge-swipe-right"
- assertNotVisible:
    id: "timer-edge-swipe-left"
- swipe:
    start: 95%, 50%
    end: 10%, 50%
- assertVisible:
    id: "timer-mode-title"
    text: "Focus"
- assertVisible:
    text: "Break"
    enabled: false
