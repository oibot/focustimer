appId: ${APP_ID}
name: focus_timer_resume_continues_running
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    id: "timer-toggle-button"
- tapOn:
    id: "timer-tap-gesture-background"
- tapOn:
    id: "timer-toggle-button"
- assertVisible:
    id: "timer-toggle-button"
    text: "Resume"
    enabled: true
- tapOn:
    id: "timer-toggle-button"
- assertNotVisible:
    id: "timer-toggle-button"
- assertNotVisible:
    id: "timer-cancel-button"
- assertVisible:
    text: "Break"
    enabled: false
