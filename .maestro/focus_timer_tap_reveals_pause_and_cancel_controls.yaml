appId: ${APP_ID}
name: focus_timer_tap_reveals_pause_and_cancel_controls
---
- runFlow:
    file: common/launch_app_allow_notifications.yaml
- tapOn:
    id: "timer-toggle-button"
- tapOn:
    id: "timer-tap-gesture-background"
- assertVisible:
    id: "timer-toggle-button"
    text: "Pause"
    enabled: true
- assertVisible:
    id: "timer-cancel-button"
    text: "Cancel"
    enabled: true
- assertVisible:
    text: "Break"
    enabled: false
